[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swave"
version = "0.1.0"
description = "Swave implementation for medbioinf/wf-structural-variants pangenomesv pipeline"
authors = [
    { name = "Jonah Kapski", email = "Jonah.Kapski@edu.ruhr-uni-bochum.de" }
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy==1.23.5",
    "matplotlib==3.5.1",
    "pysam==0.19.1",
    "torch"
]

[project.scripts]
swave-extract-alleles = "swave.cli.extract_alleles:main"
swave-generate-dotplots = "swave.cli.generate_dotplots:main"
swave-generate-projections = "swave.cli.generate_projections:main"
swave-predict = "swave.cli.predict:main"
swave-call-variants = "swave.cli.call_variants:main"
swave-write-vcf = "swave.cli.write_vcf:main"

[tool.setuptools.packages.find]
where = ["src"]